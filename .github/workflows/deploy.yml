name: Deploy

# Manual deployment to staging or production (docs/DEPLOYMENT.md).
# Inert until the GitHub Environment "staging" / "production" holds the secrets and variables below.
# Protect the "production" environment with required reviewers so every production deploy is approved.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [staging, production]
        required: true

permissions:
  contents: read

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false # never interrupt a deployment halfway

jobs:
  deploy:
    name: Deploy to ${{ inputs.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ inputs.environment }}
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check configuration
        run: |
          missing=0
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD SUPABASE_PROJECT_REF CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID \
                      CLOUDFLARE_PAGES_PROJECT VITE_SUPABASE_URL VITE_SUPABASE_ANON_KEY VITE_TURNSTILE_SITE_KEY; do
            if [ -z "${!name}" ]; then echo "::error::$name is not set for environment '${{ inputs.environment }}'"; missing=1; fi
          done
          case "$VITE_SUPABASE_URL" in https://*) ;; *) echo "::error::VITE_SUPABASE_URL must be https"; missing=1;; esac
          exit $missing
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY }}

      # Same fast checks as CI, so a deploy never ships code that fails them.
      - name: Typecheck, lint and unit tests
        run: npm run typecheck && npm run lint && npm test

      - name: Link Supabase project
        run: npx supabase link --project-ref "$SUPABASE_PROJECT_REF"

      # CLI 3.x: `db push` targets the LOCAL database unless --remote is given.
      - name: Show pending migrations (dry run)
        run: npx supabase db push --remote --password "$SUPABASE_DB_PASSWORD" --dry-run

      # The CLI asks for confirmation before changing a hosted project; CI has no terminal, so the
      # (already printed) dry run above is the review step and --yes confirms it.
      - name: Apply database migrations (forward-only)
        run: npx supabase db push --remote --password "$SUPABASE_DB_PASSWORD" --yes

      # Every SAFF function authenticates itself (ticket HMAC, Turnstile, dispatch secret, Meta signature),
      # so the gateway's JWT check is disabled explicitly instead of relying on config.toml being applied.
      - name: Deploy Edge Functions
        run: npx supabase functions deploy --use-api --no-verify-jwt --yes

      - name: Build frontend
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY }}
          VITE_PUBLIC_APP_URL: ${{ vars.VITE_PUBLIC_APP_URL }}

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }} --branch=${{ inputs.environment == 'production' && 'main' || 'staging' }}
